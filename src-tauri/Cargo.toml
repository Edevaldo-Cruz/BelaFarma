[package]
name = "belinha-pdv"
version = "5.0.0"
description = "Belinha PDV - Frente de Caixa Fiscal | Drogaria Bela Farma Sul"
authors = ["Edevaldo Cruz"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.71"
default-run = "BelinhaPDV"

[[bin]]
name = "BelinhaPDV"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0-rc.17", features = [] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-global-shortcut = "2.0.0-rc.3"
