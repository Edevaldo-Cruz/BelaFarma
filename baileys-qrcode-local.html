<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BelaFarma — Parear WhatsApp (Baileys)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #112240 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 460px;
      width: 95%;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo { font-size: 40px; margin-bottom: 10px; }
    h1 { font-size: 22px; font-weight: 700; color: #25d366; margin-bottom: 4px; }
    p.sub { font-size: 14px; color: #8899aa; margin-bottom: 24px; }

    #qr-box {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      display: none;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(37,211,102,0.25);
      width: fit-content;
    }
    #qr-box img { width: 256px; height: 256px; display: block; border-radius: 8px; }

    .spinner {
      width: 56px; height: 56px;
      border: 4px solid rgba(37,211,102,0.2);
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 16px auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; margin-bottom: 20px;
    }
    .badge.waiting { background: rgba(255,193,7,0.15); color: #ffc107; border: 1px solid rgba(255,193,7,0.3); }
    .badge.ok      { background: rgba(37,211,102,0.15); color: #25d366; border: 1px solid rgba(37,211,102,0.3); }
    .badge.error   { background: rgba(255,80,80,0.15);  color: #ff5050; border: 1px solid rgba(255,80,80,0.3); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .steps {
      text-align: left; background: rgba(37,211,102,0.06);
      border: 1px solid rgba(37,211,102,0.15);
      border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
    }
    .steps p { font-size: 13px; color: #aabbcc; line-height: 2; }
    .steps strong { color: #25d366; }

    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff; border: none; border-radius: 12px;
      padding: 11px 24px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,211,102,0.35); }
    button.sec { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }

    #msg { font-size: 13px; color: #8899aa; margin-top: 16px; }
    #countdown { font-size: 11px; color: #445566; margin-top: 6px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🤖</div>
  <h1>Parear WhatsApp — Baileys</h1>
  <p class="sub">Bela Farma Sul · Juiz de Fora</p>

  <div id="badge-wrap">
    <span class="badge waiting" id="badge">
      <span class="dot"></span>
      <span id="badge-text">Conectando ao servidor...</span>
    </span>
  </div>

  <div class="spinner" id="spinner"></div>

  <div id="qr-box">
    <img id="qr-img" src="" alt="QR Code WhatsApp" />
  </div>

  <div class="steps" id="steps">
    <p>
      <strong>Como escanear:</strong><br>
      1. Abra o <strong>WhatsApp</strong> no celular<br>
      2. Toque em <strong>⋮ → Aparelhos Conectados</strong><br>
      3. Toque em <strong>Conectar Aparelho</strong><br>
      4. Aponte a câmera para o QR Code acima
    </p>
  </div>

  <div class="btns">
    <button onclick="forcarNovo()">🔄 Novo QR Code</button>
    <button class="sec" onclick="verificar()">↺ Atualizar</button>
  </div>

  <div id="msg"></div>
  <div id="countdown"></div>
</div>

<script>
  // Detecta a URL do API backend dinamicamente
  const API = (window.location.protocol === 'file:')
    ? 'http://localhost:3001'
    : (window.location.port === '8085' || window.location.port === '80' || !window.location.port)
      ? ''
      : `http://${window.location.hostname}:3001`;
  let intervalId = null;
  let countdown  = 5;
  let connected  = false;

  function setBadge(tipo, texto) {
    const b = document.getElementById('badge');
    b.className = 'badge ' + tipo;
    document.getElementById('badge-text').textContent = texto;
  }

  function setMsg(txt) {
    document.getElementById('msg').textContent = txt;
  }

  async function verificar() {
    try {
      const r = await fetch(`${API}/api/whatsapp/baileys/status`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const s = await r.json();

      if (s.connected) {
        connected = true;
        setBadge('ok', '✅ WhatsApp Conectado!');
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('qr-box').style.display = 'none';
        setMsg('🎉 Pronto! O Baileys está online. Mensagens serão enviadas automaticamente.');
        document.getElementById('countdown').textContent = '';
        clearInterval(intervalId);
        return;
      }

      if (s.hasQR && s.qrCode) {
        setBadge('waiting', '📲 Escaneie o QR Code abaixo');
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('qr-img').src = s.qrCode;
        document.getElementById('qr-box').style.display = 'block';
        setMsg('⚠️ O QR expira em ~60s. Se sumir, clique em "Novo QR Code".');
      } else {
        setBadge('waiting', '⏳ Aguardando QR Code...');
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('qr-box').style.display = 'none';
        setMsg(s.error || 'Inicializando conexão WhatsApp...');
      }
    } catch(e) {
      setBadge('error', '❌ Servidor indisponível');
      document.getElementById('spinner').style.display = 'none';
      setMsg('Erro: ' + e.message + ' — Verifique se o servidor está online.');
    }
    countdown = 5;
  }

  async function forcarNovo() {
    setMsg('⏳ Solicitando novo QR Code...');
    document.getElementById('qr-box').style.display = 'none';
    document.getElementById('spinner').style.display = 'block';
    setBadge('waiting', '🔄 Gerando novo QR...');
    try {
      await fetch(`${API}/api/whatsapp/baileys/reconnect`, { method: 'POST' });
      setTimeout(verificar, 3000);
    } catch(e) {
      setMsg('Erro ao reconectar: ' + e.message);
    }
  }

  // Inicia verificação imediata e repete a cada 5s
  verificar();
  intervalId = setInterval(() => {
    if (connected) return;
    countdown--;
    document.getElementById('countdown').textContent = `Verificando em ${countdown}s...`;
    if (countdown <= 0) {
      verificar();
      countdown = 5;
    }
  }, 1000);
</script>
</body>
</html>
